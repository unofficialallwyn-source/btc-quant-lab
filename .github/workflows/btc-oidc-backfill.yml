name: BTC OIDC backfill verification
on:
  workflow_dispatch:
    inputs:
      start:
        description: Inclusive UTC date
        required: true
        default: '2025-09-11'
      end:
        description: Exclusive UTC date
        required: true
        default: '2025-09-12'
      execute:
        description: Allow data download and Azure write (default false)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: btc-cloud-backfill
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: btc-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: btc-research/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Login using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Validate Azure coverage and optionally ingest
        env:
          BTC_AZURE_AUTH: oidc
          WINDOW_START: ${{ inputs.start }}
          WINDOW_END: ${{ inputs.end }}
          ALLOW_EXECUTION: ${{ inputs.execute }}
        run: |
          if [ "$ALLOW_EXECUTION" = "true" ]; then
            python -m src.multi_year --start "$WINDOW_START" --end "$WINDOW_END" --execute
          else
            python -m src.multi_year --start "$WINDOW_START" --end "$WINDOW_END"
          fi
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oidc-backfill-report-${{ github.run_id }}
          path: btc-research/data/coverage.json
          if-no-files-found: warn
          retention-days: 30
