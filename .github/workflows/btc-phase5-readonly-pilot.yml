name: BTC Phase 5 read-only market pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: btc-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: btc-research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m pytest -q
      - name: Execute bounded read-only REST pilot
        run: python -m src.phase5_readonly_pilot --output data/research/phase5-readonly-pilot
      - name: Archive raw public samples and decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-phase5-readonly-pilot-${{ github.run_id }}
          path: btc-research/data/research/phase5-readonly-pilot/
          if-no-files-found: warn
          retention-days: 90
