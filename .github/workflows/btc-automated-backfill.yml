name: BTC one-click bounded historical backfill
on:
  workflow_dispatch:
    inputs:
      start:
        description: Inclusive UTC history start
        required: true
        default: '2024-02-03'
      end:
        description: Exclusive UTC end (empty = today UTC midnight)
        required: false
        default: ''
      max_batches:
        description: Maximum 28-day batches in this single workflow run
        required: true
        type: choice
        options: ['1', '8', '16', '32']
        default: '32'
      execute:
        description: Actually download and upload candles (default OFF)
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: btc-cloud-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: btc-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: btc-research/requirements.txt
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Test ingestion and integrity code
        run: python -m pytest -q
      - name: Authenticate Azure OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Run bounded automated backfill
        env:
          BTC_AZURE_AUTH: oidc
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          MAX_BATCHES: ${{ inputs.max_batches }}
          EXECUTE: ${{ inputs.execute }}
        run: |
          args=(--start "$START" --max-batches "$MAX_BATCHES"
                --days-per-batch 28 --max-runtime-minutes 240)
          if [ -n "$END" ]; then args+=(--end "$END"); fi
          if [ "$EXECUTE" = "true" ]; then args+=(--execute); fi
          python -m src.automated_backfill "${args[@]}"
      - name: Archive progress including partially completed batches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-automated-backfill-${{ github.run_id }}
          path: |
            btc-research/data/automated-backfill-summary.json
            btc-research/data/automated-backfill/batch-*.json
          if-no-files-found: warn
          retention-days: 30
