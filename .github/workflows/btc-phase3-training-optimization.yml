name: BTC Phase 3 training-only optimization
on:
  workflow_dispatch:
    inputs:
      start:
        description: Inclusive UTC research start
        required: true
        default: '2024-02-03'
      end:
        description: Exclusive UTC research end
        required: true
        default: '2026-10-26'
      signal_tf:
        description: Signal timeframe
        type: choice
        options: ['1m', '5m', '15m', '1h']
        default: '5m'
      context_tf:
        description: Context timeframe
        type: choice
        options: ['5m', '15m', '1h', '4h']
        default: '1h'
permissions:
  contents: read
  id-token: write
jobs:
  risk:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: btc-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: btc-research/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run all regression tests
        run: python -m pytest -q
      - name: Authenticate Azure read only OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Assemble verified historical data
        env:
          BTC_AZURE_AUTH: oidc
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: python -m src.gap_safe_dataset --start "$START" --end "$END" --output-dir data/research/gap-safe
      - name: Optimize volatility strategy on three training-only folds
        env:
          SIGNAL_TF: ${{ inputs.signal_tf }}
          CONTEXT_TF: ${{ inputs.context_tf }}
        run: python -m src.phase3_optimize --catalog-dir data/research/gap-safe --output data/backtest/phase3-optimization --signal-tf "$SIGNAL_TF" --context-tf "$CONTEXT_TF"
      - name: Archive training-only experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-phase3-optimization-${{ github.run_id }}
          path: |
            btc-research/data/backtest/phase3-optimization/
            btc-research/data/research/gap-safe/dataset_catalog.json
          if-no-files-found: warn
          retention-days: 30
