name: BTC cloud-aware backfill
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Inclusive start YYYY-MM-DD UTC'
        required: true
        default: '2025-07-10'
      end:
        description: 'Exclusive end YYYY-MM-DD UTC; max 28 days'
        required: true
        default: '2025-07-17'
      days:
        description: 'Partition into 1–7-day windows'
        required: true
        default: '7'
      dry_run:
        description: 'Plan and verify existing cloud data without downloading'
        type: boolean
        required: true
        default: true
concurrency:
  group: btc-cloud-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    defaults:
      run:
        working-directory: btc-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: btc-research/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run verified cloud backfill
        env:
          AZURE_BLOB_CONTAINER_SAS_URL: ${{ secrets.AZURE_BLOB_CONTAINER_SAS_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m src.cloud_backfill --start "${{ inputs.start }}" --end "${{ inputs.end }}" --days "${{ inputs.days }}" --dry-run
          else
            python -m src.cloud_backfill --start "${{ inputs.start }}" --end "${{ inputs.end }}" --days "${{ inputs.days }}"
          fi
      - name: Upload run partitions (temporary backup)
        if: success() && !inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: cloud-btc-${{ github.run_id }}
          path: btc-research/data/backfill/
          retention-days: 30
          if-no-files-found: warn
