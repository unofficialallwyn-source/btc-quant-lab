name: Azure OIDC connectivity smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'azure-identity>=1.18,<2' 'azure-storage-blob>=12.20,<13'
      - name: Login to Azure without SAS or client secret
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read historical manifest list
        working-directory: btc-research
        run: python -m src.azure_identity_check --account btcquantlabstorage --container btc-historical-data
