name: BTC Phase 5 execution cost sensitivity
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Frozen Phase 5 Step 1 diagnostic workflow run ID
        required: true
        default: '40802892631'
permissions:
  contents: read
  actions: read
jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: btc-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: btc-research/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m pytest -q
      - name: Download frozen Phase 5 trade diagnostics
        uses: actions/download-artifact@v4
        with:
          name: btc-phase5-diagnostics-${{ inputs.source_run_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: btc-research/data/phase5-step1-frozen
      - name: Evaluate locked-ledger execution-cost scenarios
        run: |
          LEDGER=$(find data/phase5-step1-frozen -type f -name training_trade_ledger.csv)
          REPORT=$(find data/phase5-step1-frozen -type f -name trade_diagnostics.json)
          test -f "$LEDGER"
          test -f "$REPORT"
          test "$(find data/phase5-step1-frozen -type f -name training_trade_ledger.csv | wc -l)" -eq 1
          test "$(find data/phase5-step1-frozen -type f -name trade_diagnostics.json | wc -l)" -eq 1
          python -m src.phase5_cost_sensitivity --ledger "$LEDGER" --diagnostics "$REPORT" --output data/backtest/phase5-cost-sensitivity
      - name: Archive cost sensitivity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-phase5-cost-sensitivity-${{ github.run_id }}
          path: btc-research/data/backtest/phase5-cost-sensitivity/
          if-no-files-found: warn
          retention-days: 90
