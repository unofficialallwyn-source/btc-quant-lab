name: BTC Phase 5 microstructure data feasibility
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Frozen Phase 5 Step 1 dataset catalog artifact run ID
        required: true
        default: '40802892631'
permissions:
  contents: read
  actions: read
jobs:
  feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: btc-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: btc-research/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m pytest -q
      - name: Download verified dataset catalog
        uses: actions/download-artifact@v4
        with:
          name: btc-phase5-diagnostics-${{ inputs.source_run_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: btc-research/data/phase5-step1-frozen
      - name: Audit market microstructure data feasibility
        run: |
          COUNT=$(find data/phase5-step1-frozen -type f -name dataset_catalog.json | wc -l)
          test "$COUNT" -eq 1
          CATALOG=$(find data/phase5-step1-frozen -type f -name dataset_catalog.json)
          python -m src.phase5_microstructure_feasibility --catalog "$CATALOG" --output data/research/phase5-microstructure
      - name: Archive feasibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-phase5-microstructure-${{ github.run_id }}
          path: btc-research/data/research/phase5-microstructure/
          if-no-files-found: warn
          retention-days: 90
