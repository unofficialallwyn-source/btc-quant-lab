name: BTC full-history collection (bounded)
on:
  workflow_dispatch:
    inputs:
      start:
        description: Inclusive UTC historical boundary (known continuous-day candidate)
        required: true
        default: '2024-02-03'
      end:
        description: Exclusive UTC end; leave empty for today's UTC midnight
        required: false
        default: ''
      max_windows:
        description: Maximum 28-day batches this run (1-12)
        type: choice
        options: ['1', '2', '4', '8', '12']
        default: '4'
      execute:
        description: Upload verified missing history (false = coverage audit only)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: btc-cloud-backfill
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: btc-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: btc-research/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Authenticate to Azure via GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Collect and independently verify missing BTC minute candles
        env:
          BTC_AZURE_AUTH: oidc
          HISTORY_START: ${{ inputs.start }}
          HISTORY_END: ${{ inputs.end }}
          BATCH_LIMIT: ${{ inputs.max_windows }}
          EXECUTE: ${{ inputs.execute }}
        run: |
          opts=(--start "$HISTORY_START" --max-windows "$BATCH_LIMIT")
          if [ -n "$HISTORY_END" ]; then opts+=(--end "$HISTORY_END"); fi
          if [ "$EXECUTE" = "true" ]; then opts+=(--execute); fi
          python -m src.full_history "${opts[@]}"
      - name: Archive verified progress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-history-progress-${{ github.run_id }}
          path: btc-research/data/full-history-progress.json
          retention-days: 30
          if-no-files-found: warn
