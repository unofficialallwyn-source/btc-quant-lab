name: BTC gap-safe research dataset export
on:
  workflow_dispatch:
    inputs:
      start:
        description: Inclusive UTC date
        required: true
        default: '2024-02-03'
      end:
        description: Exclusive UTC date (frozen historical cutoff)
        required: true
        default: '2026-10-26'
permissions:
  contents: read
  id-token: write
concurrency:
  group: btc-cloud-backfill
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: btc-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: btc-research/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Authenticate to Azure OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Export checksummed continuous research segments
        env:
          BTC_AZURE_AUTH: oidc
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          python -m src.gap_safe_dataset --start "$START" --end "$END" --output-dir data/research/gap-safe
      - name: Archive dataset catalog and verified segments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-gap-safe-research-${{ github.run_id }}
          path: btc-research/data/research/gap-safe/
          if-no-files-found: warn
          retention-days: 30
