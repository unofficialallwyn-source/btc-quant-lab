name: BTC Phase 2 chronological evaluation
on:
  workflow_dispatch:
    inputs:
      start:
        description: Inclusive UTC research start
        required: true
        default: '2024-02-03'
      end:
        description: Exclusive UTC research end
        required: true
        default: '2026-10-26'
permissions:
  contents: read
  id-token: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: btc-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: btc-research/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Test data and evaluation boundaries
        run: python -m pytest -q
      - name: Authenticate Azure OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Assemble verified historical research segments
        env:
          BTC_AZURE_AUTH: oidc
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: python -m src.gap_safe_dataset --start "$START" --end "$END" --output-dir data/research/gap-safe
      - name: Evaluate training and validation only (holdout locked)
        run: python -m src.chronological_eval --catalog-dir data/research/gap-safe --output data/backtest/chronological
      - name: Archive evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-phase2-chronological-${{ github.run_id }}
          path: |
            btc-research/data/backtest/chronological/
            btc-research/data/research/gap-safe/dataset_catalog.json
          if-no-files-found: warn
          retention-days: 30
