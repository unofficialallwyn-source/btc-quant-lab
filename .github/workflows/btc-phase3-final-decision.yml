name: BTC Phase 3 final promotion decision
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed training-only optimization run ID
        required: true
        default: '40621068040'
permissions:
  contents: read
  actions: read
jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: btc-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: btc-research/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Test all promotion safeguards
        run: python -m pytest -q
      - name: Download frozen historical training optimization artifact
        uses: actions/download-artifact@v4
        with:
          name: btc-phase3-optimization-${{ inputs.source_run_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: btc-research/data/phase3-frozen
      - name: Audit frozen evidence and write fail-closed decision
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          OPT=$(find data/phase3-frozen -type f -name training_optimization.json)
          CAT=$(find data/phase3-frozen -type f -name dataset_catalog.json)
          test "$(printf '%s\n' "$OPT" | sed '/^$/d' | wc -l)" -eq 1
          test "$(printf '%s\n' "$CAT" | sed '/^$/d' | wc -l)" -eq 1
          python -m src.phase3_promotion_gate --optimization "$OPT" --catalog "$CAT" --source-run-id "$SOURCE_RUN_ID" --output data/backtest/phase3-decision/phase3_decision.json
      - name: Archive promotion decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-phase3-decision-${{ github.run_id }}
          path: btc-research/data/backtest/phase3-decision/
          if-no-files-found: warn
          retention-days: 90
