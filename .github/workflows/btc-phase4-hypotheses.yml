name: BTC Phase 4 strategy hypotheses specification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  specify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: btc-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: btc-research/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run full regression suite
        run: python -m pytest -q
      - name: Freeze Phase 4 hypotheses without any backtests
        run: python -m src.phase4_hypotheses --output data/backtest/phase4-hypotheses/hypothesis_spec.json
      - name: Archive frozen research protocol
        uses: actions/upload-artifact@v4
        with:
          name: btc-phase4-hypotheses-${{ github.run_id }}
          path: btc-research/data/backtest/phase4-hypotheses/
          if-no-files-found: error
          retention-days: 90
