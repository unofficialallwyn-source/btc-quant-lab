name: BTC research dataset export
on:
  workflow_dispatch:
    inputs:
      start:
        description: Inclusive UTC start (must be fully covered)
        required: true
        default: '2025-07-02'
      end:
        description: Exclusive UTC end
        required: true
        default: '2025-09-14'
permissions:
  contents: read
  id-token: write
concurrency:
  group: btc-cloud-backfill
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: btc-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: btc-research/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Azure login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Assemble verified data
        env:
          BTC_AZURE_AUTH: oidc
          WINDOW_START: ${{ inputs.start }}
          WINDOW_END: ${{ inputs.end }}
        run: python -m src.research_dataset --start "$WINDOW_START" --end "$WINDOW_END"
      - name: Run baseline research (simulation only)
        run: python -m src.research --input data/research/BTCUSD_1m_verified.parquet --output data/research/results
      - uses: actions/upload-artifact@v4
        with:
          name: btc-research-${{ github.run_id }}
          path: |
            btc-research/data/research/BTCUSD_1m_verified.json
            btc-research/data/research/results/
          retention-days: 30
          if-no-files-found: error
