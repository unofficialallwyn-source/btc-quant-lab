name: BTC Phase 4 final candidate decision
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Phase 4 walk-forward training workflow run ID
        required: true
        default: '40735017966'
permissions:
  contents: read
  actions: read
jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: btc-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: btc-research/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m pytest -q
      - name: Download frozen Phase 4 walkforward artifact
        uses: actions/download-artifact@v4
        with:
          name: btc-phase4-walkforward-${{ inputs.source_run_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: btc-research/data/phase4-frozen
      - name: Audit archived evidence without evaluating price data
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          REPORT=$(find data/phase4-frozen -type f -name walkforward_report.json)
          CAT=$(find data/phase4-frozen -type f -name dataset_catalog.json)
          test "$(printf '%s\n' "$REPORT" | sed '/^$/d' | wc -l)" -eq 1
          test "$(printf '%s\n' "$CAT" | sed '/^$/d' | wc -l)" -eq 1
          python -m src.phase4_decision_gate --walkforward "$REPORT" --catalog "$CAT" --source-run-id "$SOURCE_RUN_ID" --output data/backtest/phase4-decision/final_decision.json
      - name: Archive final decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-phase4-decision-${{ github.run_id }}
          path: btc-research/data/backtest/phase4-decision/
          if-no-files-found: warn
          retention-days: 90
